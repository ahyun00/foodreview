
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>관리자 페이지 | FoodReview</title>

    <link rel="stylesheet" th:href="@{/css/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

    <!-- 공통 헤더 -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container admin-main">

        <!-- 페이지 제목 -->
        <section class="admin-heading">

            <p class="eyebrow">ADMIN DASHBOARD</p>

            <h1>관리자 페이지</h1>

            <p>
                방문 인증과 회원 정보를 관리할 수 있습니다.
            </p>

        </section>

        <!-- 관리자 메뉴 -->
        <section class="admin-menu-grid">

            <!-- 방문 인증 관리 -->
            <a class="admin-menu-card"
               th:href="@{/admin/visits}">

                <span class="admin-menu-number">01 / VISITS</span>

                <h2>방문 인증 관리</h2>

                <p>
                    제출된 영수증을 확인하고
                    방문 인증을 승인하거나 거절합니다.
                </p>

                <span class="admin-menu-link">
                    관리하기 →
                </span>

            </a>

            <!-- 회원 관리 -->
            <a class="admin-menu-card"
               th:href="@{/admin/members}">

                <span class="admin-menu-number">02 / MEMBERS</span>

                <h2>회원 관리</h2>

                <p>
                    가입한 회원의 정보와
                    계정 상태를 확인하고 관리합니다.
                </p>

                <span class="admin-menu-link">
                    관리하기 →
                </span>

            </a>

        </section>

        <div class="admin-bottom">

            <a th:href="@{/}">
                ← 메인으로 돌아가기
            </a>

        </div>

    </main>

    <!-- 공통 푸터 -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
