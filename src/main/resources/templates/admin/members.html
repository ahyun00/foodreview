
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>회원 관리 | FoodReview</title>

    <link rel="stylesheet" th:href="@{/css/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

    <!-- 공통 헤더 -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container admin-main">

        <!-- 페이지 제목 -->
        <section class="admin-heading">

            <p class="eyebrow">MEMBER MANAGEMENT</p>

            <h1>회원 관리</h1>

            <p>가입한 회원의 정보와 계정 상태를 관리합니다.</p>

        </section>

        <!-- 회원 없음 -->
        <div class="admin-empty"
             th:if="${#lists.isEmpty(members)}">

            <p>등록된 회원이 없습니다.</p>

        </div>

        <!-- 회원 목록 -->
        <div class="admin-table-wrap"
             th:unless="${#lists.isEmpty(members)}">

            <table class="admin-table">

                <thead>
                    <tr>
                        <th>회원번호</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>닉네임</th>
                        <th>가입일</th>
                        <th>상태</th>
                        <th>권한</th>
                        <th>관리</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="member : ${members}">

                        <td th:text="${member.mno}">
                            회원번호
                        </td>

                        <td th:text="${member.name}">
                            이름
                        </td>

                        <td th:text="${member.email}">
                            이메일
                        </td>

                        <td th:text="${member.nickname}">
                            닉네임
                        </td>

                        <td th:text="${member.joinDate}">
                            가입일
                        </td>

                        <!-- 회원 상태 -->
                        <td>

                            <span class="admin-status approved"
                                  th:if="${member.active == 1}">
                                활성
                            </span>

                            <span class="admin-status rejected"
                                  th:unless="${member.active == 1}">
                                비활성
                            </span>

                        </td>

                        <!-- 회원 권한 -->
                        <td>

                            <span class="admin-role"
                                  th:text="${member.role}">
                                USER
                            </span>

                        </td>

                        <!-- 활성화 / 비활성화 -->
                        <td>

                            <form th:if="${member.role == 'USER'}"
                                  th:action="@{/admin/members/active}"
                                  method="post"
                                  onsubmit="return confirm('회원 상태를 변경하시겠습니까?');">

                                <input type="hidden"
                                       name="mno"
                                       th:value="${member.mno}">

                                <input type="hidden"
                                       name="active"
                                       th:value="${member.active == 1 ? 0 : 1}">

                                <button class="admin-member-button"
                                        type="submit"
                                        th:text="${member.active == 1 ? '비활성화' : '활성화'}">
                                    상태 변경
                                </button>

                            </form>

                            <span class="admin-action-muted"
                                  th:unless="${member.role == 'USER'}">
                                변경 불가
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- 관리자 메인 돌아가기 -->
        <div class="admin-bottom">

            <a th:href="@{/admin}">
                ← 관리자 메인으로
            </a>

        </div>

    </main>

    <!-- 공통 푸터 -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- 회원 상태 변경 결과 -->
    <script th:if="${message}" th:inline="javascript">
        const message = /*[[${message}]]*/ "";
        alert(message);
    </script>

</body>
</html>
