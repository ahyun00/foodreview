
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>리뷰 목록 | FoodReview</title>

    <link rel="stylesheet" th:href="@{/css/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/review.css}">
</head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container review-main">

        <section class="review-intro">
            <p class="eyebrow">REAL VISITS. REAL REVIEWS.</p>
            <h1>방문자의 솔직한 리뷰.</h1>
            <p class="review-description">
                방문 인증을 통해 작성된 리뷰를 확인해 보세요.
            </p>
        </section>

        <!-- 리뷰가 없을 때 -->
        <p class="review-empty"
           th:if="${#lists.isEmpty(reviews)}">
            아직 등록된 리뷰가 없습니다.
        </p>

        <!-- 리뷰 목록 -->
        <section class="review-list"
                 th:unless="${#lists.isEmpty(reviews)}">

            <article class="review-item"
                     th:each="review : ${reviews}">

                <span class="review-date"
                      th:text="${review.regDate}">
                    작성일
                </span>

                <a class="review-place-name"
                   th:href="@{/reviews/{rno}(rno=${review.rno})}"
                   th:text="${review.placeName}">
                    가게 이름
                </a>

                <div class="review-meta">

                    <span class="review-stars">
                        <span th:each="star : ${#numbers.sequence(1, 5)}"
                              th:text="${star <= review.rating ? '★' : '☆'}">
                        </span>
                    </span>

                    <span class="review-author"
                          th:text="${review.nickname}">
                        작성자
                    </span>

                </div>

                <p class="review-content"
                   th:text="${review.content}">
                    리뷰 내용
                </p>		
				
				<!-- 리뷰 이미지가 있을 때만 표시 -->
				<div class="review-thumbnail"
				     th:if="${review.reviewImage != null
				              and !review.reviewImage.isEmpty()}">

				    <img th:src="@{/review-images/{savedName}(savedName=${review.reviewImage})}"
				         th:alt="${review.placeName + ' 리뷰 사진'}"
				         loading="lazy"
				         onerror="this.parentElement.style.display='none'">

				</div>

                <a class="review-detail-link"
                   th:href="@{/reviews/{rno}(rno=${review.rno})}">
                    리뷰 자세히 보기
                </a>

            </article>

        </section>

        <!-- 페이징 -->
        <nav class="review-pagination"
             th:if="${totalPages > 0}">

            <a th:each="i : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/reviews(page=${i})}"
               th:text="${i}"
               th:classappend="${i == page} ? 'active' : ''">
                1
            </a>

        </nav>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
