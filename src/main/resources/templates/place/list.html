
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>맛집 탐색 | FoodReview</title>

    <link rel="stylesheet" th:href="@{/css/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/place.css}">
</head>

<body>

    <!-- 공통 헤더 -->
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container place-list-main">

        <!-- 페이지 제목 -->
        <section class="place-list-heading">

            <p class="eyebrow">EXPLORE PLACES</p>

            <h1>나에게 맞는 맛집을 찾아보세요.</h1>

            <p class="place-list-description">
                다양한 맛집과 카페를 탐색해 보세요.
            </p>

        </section>

        <!-- 이름 검색 + 카테고리 필터 -->
        <form class="place-search-form"
              th:action="@{/places}"
              method="get">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="맛집 이름을 검색하세요"
                   aria-label="맛집 이름 검색">

            <select name="category"
                    aria-label="카테고리 선택">

                <option value="">전체 카테고리</option>

                <option value="카페"
                        th:selected="${category == '카페'}">
                    카페
                </option>

                <option value="한식"
                        th:selected="${category == '한식'}">
                    한식
                </option>

                <option value="일식"
                        th:selected="${category == '일식'}">
                    일식
                </option>

            </select>

            <button class="button-primary" type="submit">
                검색
            </button>

        </form>

        <!-- 검색 결과 없음 -->
        <div class="place-list-empty"
             th:if="${#lists.isEmpty(placeList)}">

            <p>검색 결과가 없습니다.</p>

            <a class="button-outline" th:href="@{/places}">
                전체 목록 보기
            </a>

        </div>

        <!-- 가게 카드 목록 -->
        <section class="place-grid"
                 th:unless="${#lists.isEmpty(placeList)}">

            <a class="place-card"
               th:each="place : ${placeList}"
               th:href="@{/places/{pno}(pno=${place.pno})}">

                <!-- 가게 대표 이미지 -->
                <div class="place-card-image">

                    <img th:if="${place.placeImage != null and !place.placeImage.isEmpty()}"
                         th:src="@{/images/places/{file}(file=${place.placeImage})}"
                         th:alt="${place.name}"
                         loading="lazy">

                    <div class="place-image-placeholder"
                         th:unless="${place.placeImage != null and !place.placeImage.isEmpty()}">
                        NO IMAGE
                    </div>

                </div>

                <!-- 가게 정보 -->
                <div class="place-card-body">

                    <span class="place-category"
                          th:text="${place.category}">
                        카테고리
                    </span>

                    <h3 th:text="${place.name}">
                        가게 이름
                    </h3>

                    <p th:text="${place.address}">
                        가게 주소
                    </p>

                    <span class="place-more">
                        자세히 보기 →
                    </span>

                </div>

            </a>

        </section>

        <!-- 페이지 번호 -->
        <nav class="place-pagination"
             th:if="${totalPages > 0}">

            <a th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/places(
                   page=${pageNum},
                   keyword=${keyword},
                   category=${category}
               )}"
               th:text="${pageNum}"
               th:classappend="${pageNum == page} ? 'active' : ''">
                1
            </a>

        </nav>

        <!-- 전체 목록 -->
        <div class="place-list-bottom">

            <a th:href="@{/places}">
                전체 목록 보기
            </a>

        </div>

    </main>

    <!-- 공통 푸터 -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
